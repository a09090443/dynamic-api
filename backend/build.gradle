plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.dynamicapi'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.github.a09090443:base-spring-boot-starter:3.2.5.4'
    implementation 'io.github.a09090443:web-spring-boot-starter:3.2.5.1'
    implementation 'io.github.a09090443:db-spring-boot-starter:3.2.5.3'
    implementation 'io.github.a09090443:web-service-spring-boot-starter:3.2.5.3'

    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.2.5'
    developmentOnly 'org.springframework.boot:spring-boot-devtools:3.2.5'  // 只在開發時使用，不打包到 JAR
    implementation 'net.sf.jasperreports:jasperreports:6.20.6'
    implementation 'com.github.librepdf:openpdf:1.3.30'
    implementation 'org.eclipse.persistence:eclipselink:3.0.4'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.h2database:h2:2.2.220'
    implementation 'org.flywaydb:flyway-core:10.14.0'
    implementation 'org.apache.cxf:cxf-tools-wsdlto-frontend-jaxws:4.0.0'
    implementation 'org.apache.cxf:cxf-tools-wsdlto-databinding-jaxb:4.0.0'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ======================================================
// 前端建置任務 - Next.js
// ======================================================

// Next.js 任務
tasks.register('installNextjs', Exec) {
    workingDir file('../nextjs-dynamic-api-manager').absolutePath
    def nodeDir = file('../tools/node-v22.20.0-win-x64').absolutePath
    def npmPath = "${nodeDir}/npm.cmd"
    environment 'PATH', nodeDir + File.pathSeparator + System.env.PATH
    commandLine npmPath, 'install'
}

tasks.register('buildNextjs', Exec) {
    dependsOn 'installNextjs'
    workingDir file('../nextjs-dynamic-api-manager').absolutePath
    def nodeDir = file('../tools/node-v22.20.0-win-x64').absolutePath
    def npmPath = "${nodeDir}/npm.cmd"

    // 明確設定 NODE_ENV 為 production，確保 Gradle 建置使用生產模式
    // 這樣不會影響到開發者手動執行 npm run dev
    environment 'NODE_ENV', 'production'
    environment 'PATH', nodeDir + File.pathSeparator + System.env.PATH

    // 使用 npm run build（已在 package.json 中配置）
    commandLine npmPath, 'run', 'build'
}

// 清空 static 目錄任務
tasks.register('cleanStatic', Delete) {
    delete 'src/main/resources/static'
    
    doFirst {
        println "清空 src/main/resources/static 目錄"
    }
}

tasks.register('copyNextjsBuild', Copy) {
    dependsOn 'buildNextjs', 'cleanStatic'
    // 確保先清空再複製
    mustRunAfter 'cleanStatic'
    
    from '../nextjs-dynamic-api-manager/out'
    into 'src/main/resources/static'

    doFirst {
        println "複製 Next.js 建置產物到 src/main/resources/static"
    }
    
    doLast {
        // 重命名子目錄中的 index.html 為對應的頁面名稱
        def staticDir = file('src/main/resources/static')
        def pages = ['endpoint', 'restful', 'response', 'test-api', 'about']
        
        pages.each { page ->
            def pageDir = new File(staticDir, page)
            def indexFile = new File(pageDir, 'index.html')
            def targetFile = new File(staticDir, "${page}.html")
            
            if (indexFile.exists()) {
                // 複製並重命名
                copy {
                    from indexFile
                    into staticDir
                    rename { "${page}.html" }
                }
                println "  ✓ 複製 ${page}/index.html -> ${page}.html"
            }
        }
        
        def fileCount = fileTree('src/main/resources/static').files.size()
        println "✅ 複製完成，共 ${fileCount} 個檔案"
    }
}

// 統一的前端建置任務
tasks.register('buildFrontend') {
    group = 'frontend'
    description = "建置前端專案 (Next.js)"
    dependsOn 'copyNextjsBuild'
    
    doFirst {
        println "=========================================="
        println "建置前端: Next.js"
        println "環境: ${project.hasProperty('env') ? project.property('env') : 'dev'}"
        println "=========================================="
    }
}

// 整合到 processResources
tasks.named('processResources') {
    dependsOn 'buildFrontend'
}

def env = project.hasProperty('env') ? project.property('env') : 'dev'

tasks.register('forceUpdateProperties') {
    doLast {
        println "Forcing update of properties files for environment: ${env}"

        def resourcesDir = layout.buildDirectory.dir("resources/main").get().asFile
        resourcesDir.mkdirs() // 確保目錄存在

        // 強制更新 resources.properties
        def resourcesFile = new File(resourcesDir, "resources.properties")
        resourcesFile.delete()
        file("src/main/resources/resources_${env}.properties").withInputStream { input ->
            resourcesFile.withOutputStream { output ->
                output << input
            }
        }

        // 強制更新 data-source.properties
        def dataSourceFile = new File(resourcesDir, "data-source.properties")
        dataSourceFile.delete()
        file("src/main/resources/data-source_${env}.properties").withInputStream { input ->
            dataSourceFile.withOutputStream { output ->
                output << input
            }
        }

        // 刪除其他環境特定文件
        resourcesDir.listFiles().each { file ->
            if (file.name.startsWith("resources_") || file.name.startsWith("data-source_")) {
                file.delete()
            }
        }

        println "Properties files have been forcibly updated."
    }
}

tasks.named('bootJar') {
    dependsOn 'forceUpdateProperties'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(["-parameters", "-Xlint:deprecation"])
    options.annotationProcessorPath = configurations.annotationProcessor
}

tasks.named('test') {
    useJUnitPlatform()
}
