services:
  app:
    image: dynamic-api
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--dynamic.data-source-map[webservice].url=jdbc:sqlite:/data/sqlite/webservice.db"
      - "--jar.file.dir=/data/jars/"
      - "--log.base=/data/logs"
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/data/sqlite
      - uploaded-jars:/data/jars
      - application-logs:/data/logs

volumes:
  sqlite-data:
  uploaded-jars:
  application-logs:
